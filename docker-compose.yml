services:
  # ========================================================
  # ANUBIS TRAVEL - PostgreSQL Database (Laravel 11 Backend)
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: anubis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: anubis_travel
      POSTGRES_USER: anubis
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anubis -d anubis_travel"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - anubis-network

  # ========================================================
  # Redis Cache & Queue Worker Store
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: anubis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - anubis-network

  # ========================================================
  # pgAdmin (Web GUI for PostgreSQL Database Management)
  # Accessible at: http://localhost:5050
  # ========================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: anubis-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@anubis.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - anubis-network

networks:
  anubis-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
